{% extends 'base.html' %}
{% block title %}{% if object %}{{object.title}}{% else %}Add new{% endif %}{% endblock title %}
{% block content %}
    <h1>{% if object %}Edit Content{% else %}Add New Content{% endif %}</h1>
    <div class="module">
        <h2>Course Info</h2>
        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <p><input type="submit" value="Save Content"></p>
        </form>
    </div>
{% endblock content %}
